[project]
name = "moss"
version = "0.1.0"
description = "MOSS Hybrid Kernel Build Tools"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.24.1",
    "rich>=14.3.3",
    "packaging>=25.0",
    "pydantic>=2.11",
]

[project.scripts]
format = "format:app"
build = "build:app"
lint = "lint:run"
qemu = "qemu:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["format", "build", "lint", "qemu"]

[tool.setuptools.packages.find]
include = ["scripts"]

[dependency-groups]
dev = [
    "clang-format>=23.1.0",
    "cmake>=4.4.3",
    "cmake-format>=0.6.13",
    "ninja>=1.13.0",
    "pathspec>=1.1.1",
    "pygit2>=1.19.2",
    "pytest>=8.0",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in string — Chinese text is intentional
    "RUF002",  # ambiguous unicode in docstring
    "RUF003",  # ambiguous unicode in comment
    "B008",    # function call in default argument — typer.Option() pattern
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts/tests"]
