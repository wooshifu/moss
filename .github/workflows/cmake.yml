name: CMake workflow

on:
  push:
    # Toolchain-only changes run after publication, including the first image.
    paths-ignore:
      - .github/workflows/cmake.yml
      - .github/workflows/toolchain.yml
      - docker/Dockerfile.ci
      - pyproject.toml
      - uv.lock
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Toolchain image]
    branches: [master]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset:
          - arm64-debug
          - arm64-release
          - arm64-relwithdebinfo
          - x64-debug
          - x64-release
          - x64-relwithdebinfo
          - riscv64-debug
          - riscv64-release
          - riscv64-relwithdebinfo
    env:
      PYTHONUTF8: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install native LLVM and QEMU
        shell: pwsh
        run: |
          choco install llvm qemu --yes --no-progress --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH
          'C:\Program Files\qemu' >> $env:GITHUB_PATH

      - name: Sync locked build dependencies
        run: uv sync --frozen --no-install-project

      # GDB is intentionally absent: only the two optional input-barrier probes
      # need it. The remaining CTest suites must run on a native Windows host.
      - name: Configure, build and test
        run: uv run cmake --workflow --preset ${{ matrix.preset }}

      - name: Host-side regression tests
        if: ${{ !cancelled() && matrix.preset == 'arm64-debug' }}
        run: uv run python -m pytest

      - name: Preserve test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/validation/
            build/${{ matrix.preset }}/production-boot/
            build/${{ matrix.preset }}/supervisor-reset/
            build/${{ matrix.preset }}/pvh-initrd/

  workflow:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}-toolchain:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        # Container jobs otherwise use sh; pipefail must preserve listing errors.
        shell: bash
    env:
      SCCACHE_DIR: /tmp/sccache
      # Every workflow uses the same launchers without replacing the real Clang compiler.
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Sync locked build dependencies
        # Usually a no-op; also supports PRs that change the lockfile before publication.
        run: uv sync --frozen --no-install-project

      - name: Identify compiler cache versions
        id: toolchain
        run: |
          echo "llvm=$(llvm-config --version)" >> "$GITHUB_OUTPUT"
          echo "sccache=$(sccache --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          # Cache archives are immutable; each attempt saves the accumulated results under a new key.
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.llvm }}-${{ steps.toolchain.outputs.sccache }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.llvm }}-${{ steps.toolchain.outputs.sccache }}-

      # Keep checking subsequent presets after a failure, but skip them if preparation
      # failed or the run was cancelled. Any failed step still fails the job.
      - name: ARM64 Debug
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset arm64-debug

      - name: ARM64 Release
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset arm64-release

      - name: ARM64 RelWithDebInfo
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset arm64-relwithdebinfo

      - name: X64 Debug
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset x64-debug

      - name: X64 Release
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset x64-release

      - name: X64 RelWithDebInfo
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset x64-relwithdebinfo

      - name: RISCV64 Debug
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset riscv64-debug

      - name: RISCV64 Release
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset riscv64-release

      - name: RISCV64 RelWithDebInfo
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: cmake --workflow --preset riscv64-relwithdebinfo

      - name: Report compiler cache statistics
        if: always() && steps.toolchain.outcome == 'success'
        run: |
          sccache --show-stats
          # Stop the server before archiving so all cache writes have finished.
          sccache --stop-server

      - name: Save compiler cache
        # A QEMU test failure should not discard successful compilation results.
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
