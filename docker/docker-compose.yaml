# MOSS Kernel — Docker Compose for QEMU Testing
#
# Quick start:
#   docker compose -f docker/docker-compose.yaml build
#   docker compose -f docker/docker-compose.yaml run moss-qemu              # ARM64 kernel
#   docker compose -f docker/docker-compose.yaml run moss-qemu test         # run tests
#   docker compose -f docker/docker-compose.yaml run moss-qemu run --arch x86_64
#   docker compose -f docker/docker-compose.yaml run moss-qemu shell        # interactive shell

services:
  moss-qemu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.qemu
    # Bind-mount source tree so the image stays small and code changes are instant
    volumes:
      - ..:/moss
    # Allocate a pseudo-TTY so QEMU serial console works interactively
    stdin_open: true
    tty: true
    environment:
      # Default architecture and build type (overridable)
      - MOSS_ARCH=${MOSS_ARCH:-arm64}
      - MOSS_BUILD_TYPE=${MOSS_BUILD_TYPE:-debug}
      - TERM=${TERM:-xterm-256color}

  # Convenience aliases for common operations
  moss-test:
    extends: moss-qemu
    command: ["test"]

  moss-build:
    extends: moss-qemu
    command: ["build"]
